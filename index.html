<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Veille européenne sur la réglementation, les contestations et les réseaux d’acteurs autour des data centers.">
  <title>Atlas européen des data centers</title>
  <link rel="stylesheet" href="./css/atlas.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header>
    <div class="label">Observatoire européen</div>
    <h1>Atlas des data centers</h1>
    <p>Réglementation, acceptabilité et dynamiques d’influence.</p>
  </header>
  <main>
    <nav class="mode-bar" id="modes" aria-label="Modes de lecture"></nav>
    <div class="toolbar">
      <label>Pays <select id="country"><option value="">Tous les pays</option></select></label>
      <label>Thème <select id="topic"><option value="">Tous les thèmes</option></select></label>
      <label>Chronologie <select id="year"><option value="">Toutes les dates</option></select></label>
    </div>
    <noscript>Activez JavaScript pour utiliser la carte et consulter les fiches.</noscript>
    <p id="notice" role="status">Chargement de l’atlas…</p>
    <div class="layout" id="workspace" hidden>
      <section class="panel map-panel" aria-label="Carte européenne">
        <div class="map">
          <svg id="map" role="group" aria-label="Pays d’Europe">
            <g id="borders"></g>
            <g id="labels" aria-hidden="true"></g>
          </svg>
          <div class="tip" id="tip" hidden></div>
        </div>
        <div class="legend" id="legend"></div>
      </section>
      <section class="panel details" id="details" aria-label="Fiche pays et analyse" tabindex="-1"></section>
    </div>
    <footer id="footer"></footer>
  </main>
</body>
</html>
